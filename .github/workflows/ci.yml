name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        # Wheels only: a missing wheel should fail fast, not compile from source.
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The tests are fully offline: no secrets, no network, no API calls.
      - name: Test
        run: python -m pytest
